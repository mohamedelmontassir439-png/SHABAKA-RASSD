{% extends "base.html" %}
{% block body %}
<div class="page-narrow" style="max-width:380px;padding-top:80px">
  <div style="text-align:center;margin-bottom:28px">
    <div style="font-family:var(--mono);font-size:9px;color:var(--text4);letter-spacing:2px">ADMINISTRATION · ATLAS PRO</div>
  </div>
  {% if err %}<div class="alert alert-err" style="margin-bottom:16px">{{ err }}</div>{% endif %}
  <form method="post" style="display:flex;flex-direction:column;gap:12px">
    <input name="pwd" type="password" class="inp" placeholder="Mot de passe administrateur" autofocus>
    <button type="submit" class="btn btn-primary btn-full" style="padding:12px">Accéder →</button>
  </form>
</div>
{% endblock %}
