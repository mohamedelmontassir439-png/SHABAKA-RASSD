{% extends "base.html" %}{% block fullpage %}
<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SOURCE — Connexion</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@800;900&family=DM+Sans:wght@400;500;600&family=Noto+Kufi+Arabic:wght@400;600&display=swap" rel="stylesheet">
<style>:root{--blue:#c8a96e;--blue2:#d4b483;--void:#070501;--surface:#120d08;--border:rgba(255,255,255,.08);--border2:rgba(255,255,255,.14);--text1:#f1f5f9;--text2:#94a3b8;--text3:#475569}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--void);color:var(--text1);font-family:'DM Sans',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.wrap{width:100%;max-width:400px}.logo{font-family:'Syne',sans-serif;font-weight:900;font-size:24px;text-align:center;margin-bottom:32px;display:flex;align-items:center;justify-content:center;gap:10px}.logo-icon{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,#c8a96e,#8a6d3b);display:flex;align-items:center;justify-content:center;font-size:18px}.card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:32px 28px}h2{font-family:'Syne',sans-serif;font-weight:800;font-size:22px;margin-bottom:6px}.sub{font-size:13px;color:var(--text2);margin-bottom:28px}.field{margin-bottom:18px}label{font-size:12px;font-weight:600;color:var(--text2);display:block;margin-bottom:6px}input{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--border2);border-radius:10px;padding:12px 14px;color:var(--text1);font-family:inherit;font-size:14px;outline:none;transition:.2s}input:focus{border-color:rgba(200,169,110,.5)}input::placeholder{color:var(--text3)}.err{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.25);border-radius:10px;padding:12px;font-size:13px;color:#fca5a5;margin-bottom:18px}.btn{width:100%;padding:14px;border-radius:10px;background:#c8a96e;color:#fff;font-family:'Syne',sans-serif;font-weight:800;font-size:15px;border:none;cursor:pointer;box-shadow:0 6px 20px rgba(200,169,110,.35)}.btn:hover{background:#d4b483}.link{text-align:center;margin-top:16px;font-size:13px;color:var(--text2)}.link a{color:#d4b483;font-weight:600}</style></head>
<body>
<div class="wrap">
  <div class="logo"><div class="logo-icon">⚡</div>SOURCE</div>
  <div class="card">
    <h2>Connexion</h2>
    <p class="sub">Accédez à votre espace SOURCE</p>
    {% if error %}<div class="err">⚠ {{ error }}</div>{% endif %}
    <form method="POST" action="/login">
      <input type="hidden" name="next_url" value="{{ next or '/dashboard' }}">
      <input type="hidden" name="lang" value="fr">
      <div class="field"><label>Email</label><input type="email" name="email" placeholder="email@entreprise.ma" required autofocus></div>
      <div class="field"><label>Mot de passe</label><input type="password" name="password" placeholder="••••••••" required></div>
      <button type="submit" class="btn">Se connecter →</button>
    </form>
    <div class="link">Pas encore de compte? <a href="/register">Créer un compte</a></div>
  </div>
</div>
</body></html>
{% endblock %}
