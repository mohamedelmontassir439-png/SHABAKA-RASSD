<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><title>دخول الأدمن</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Cairo',sans-serif;background:#1a0a00;display:flex;align-items:center;justify-content:center;min-height:100vh}
.box{background:white;border-radius:16px;padding:40px;width:360px;text-align:center}
h1{font-size:22px;font-weight:900;margin-bottom:8px;color:#1a0a00}p{color:#888;font-size:14px;margin-bottom:28px}
input{width:100%;padding:12px 16px;border:1.5px solid #e8d5b7;border-radius:8px;font-family:'Cairo',sans-serif;font-size:15px;text-align:center;margin-bottom:16px;outline:none}
input:focus{border-color:#8B4513}
button{width:100%;padding:13px;background:#8B4513;color:white;border:none;border-radius:8px;font-family:'Cairo',sans-serif;font-size:16px;font-weight:700;cursor:pointer}
button:hover{background:#A0522D}</style></head>
<body><div class="box"><div style="font-size:40px;margin-bottom:16px">🔐</div>
<h1>لوحة الإدارة</h1><p>أدخل كلمة المرور للدخول</p>
<form method="get"><input type="password" name="pwd" placeholder="كلمة المرور" autofocus><button type="submit">دخول</button></form></div>
</body></html>
