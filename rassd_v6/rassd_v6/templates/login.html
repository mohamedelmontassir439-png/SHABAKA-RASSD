<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><title>دخول — شبكة رصد</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Cairo',sans-serif;background:linear-gradient(135deg,#1a0a00,#3d1a00);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.box{background:white;border-radius:20px;padding:40px;width:100%;max-width:400px}
.logo{text-align:center;font-size:22px;font-weight:900;color:#1a0a00;margin-bottom:8px}.logo span{color:#C8860A}
h2{text-align:center;font-size:20px;font-weight:700;margin-bottom:6px;color:#1a0a00}
p{text-align:center;color:#888;font-size:14px;margin-bottom:28px}
label{font-size:13px;font-weight:700;color:#1a0a00;display:block;margin-bottom:6px}
input{width:100%;padding:12px 16px;border:1.5px solid #e8d5b7;border-radius:9px;font-family:'Cairo',sans-serif;font-size:15px;margin-bottom:20px;outline:none}
input:focus{border-color:#8B4513}
button{width:100%;padding:13px;background:linear-gradient(135deg,#1a0a00,#8B4513);color:white;border:none;border-radius:9px;font-family:'Cairo',sans-serif;font-size:16px;font-weight:700;cursor:pointer}
.error{background:#fef2f2;color:#dc2626;padding:12px;border-radius:8px;font-size:13px;margin-bottom:16px;text-align:center}
.links{text-align:center;margin-top:16px;font-size:13px;color:#888}
.links a{color:#8B4513;font-weight:700}</style></head>
<body><div class="box">
<div class="logo">📡 شبكة <span>رصد</span></div>
<h2>تسجيل الدخول</h2>
<p>أدخل رقم هاتفك المسجل</p>
{% if error %}<div class="error">{{ error }}</div>{% endif %}
<form method="post" action="/login">
<label>رقم الهاتف</label>
<input type="tel" name="phone" placeholder="0612345678" autofocus required>
<button type="submit">→ دخول</button>
</form>
<div class="links">لا تملك حساباً؟ <a href="/register">سجّل مجاناً</a></div>
</div></body></html>
