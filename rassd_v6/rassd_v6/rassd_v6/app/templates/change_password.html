{% extends "base.html" %}
{% block title %}Changer le mot de passe — Modern Business{% endblock %}
{% block body %}
<div style="min-height:calc(100dvh - var(--nh));display:flex;align-items:center;justify-content:center;padding:40px var(--pad)">
  <div style="width:100%;max-width:420px">
    <div class="tc mb24">
      <div class="slbl mb12" style="justify-content:center">Sécurité du compte</div>
      <h1 style="font-family:var(--serif);font-size:28px;font-weight:900;font-style:italic">Changer le mot de passe</h1>
      <p style="font-size:12px;color:var(--ink5);margin-top:8px">{{ member.email }}</p>
    </div>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    {% if ok %}<div class="ok">{{ ok }}</div>{% endif %}
    <div class="card p24">
      <form method="post" action="/settings/password">
        <div class="fg">
          <label class="lbl">Mot de passe actuel</label>
          <input type="password" name="current" class="inp" placeholder="••••••••" required autofocus>
        </div>
        <div class="div-h mb16"></div>
        <div class="fg">
          <label class="lbl">Nouveau mot de passe</label>
          <input type="password" name="new_pwd" class="inp" placeholder="Min. 8 caractères" required minlength="8">
        </div>
        <div class="fg">
          <label class="lbl">Confirmer le nouveau mot de passe</label>
          <input type="password" name="confirm" class="inp" placeholder="Répéter le mot de passe" required>
        </div>
        <button type="submit" class="btn btn-gold btn-full btn-lg mt4">Modifier →</button>
      </form>
    </div>
    <div class="tc mt16">
      <a href="/settings" style="font-size:12px;color:var(--ink5)">← Retour aux paramètres</a>
    </div>
  </div>
</div>
{% endblock %}
