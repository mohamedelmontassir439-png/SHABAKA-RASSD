{% extends "base.html" %}
{% block title %}Inscription{% endblock %}
{% block body %}
<div style="min-height:calc(100vh - var(--nav));padding:44px 20px 64px">
  <div style="max-width:580px;margin:0 auto">
    <div style="text-align:center;margin-bottom:28px">
      <div style="font-family:var(--serif);font-size:26px;font-weight:700;margin-bottom:5px">Créer un compte</div>
      <div style="font-size:13px;color:var(--text3)">Gratuit — Accès immédiat</div>
    </div>
    {% if error %}<div class="form-error">{{ error }}</div>{% endif %}
    <div class="card" style="padding:28px">
      <form method="post" action="/register">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
          <div class="form-group"><label class="form-label">Nom complet *</label><input type="text" name="nom" class="form-input" required></div>
          <div class="form-group"><label class="form-label">Entreprise</label><input type="text" name="entreprise" class="form-input"></div>
          <div class="form-group"><label class="form-label">Email *</label><input type="email" name="email" class="form-input" required></div>
          <div class="form-group"><label class="form-label">Téléphone</label><input type="text" name="phone" class="form-input"></div>
          <div class="form-group"><label class="form-label">Secteur d'activité</label>
            <select name="secteur" class="form-select">
              <option value="">Sélectionner…</option>
              {% for s in SECTEURS %}<option value="{{ s }}">{{ s }}</option>{% endfor %}
            </select>
          </div>
          <div class="form-group"><label class="form-label">Ville</label><input type="text" name="ville" class="form-input" placeholder="Casablanca…"></div>
        </div>
        <div class="form-group"><label class="form-label">Mot de passe * (min. 8 caractères)</label><input type="password" name="password" class="form-input" required minlength="8"></div>
        <button type="submit" class="btn btn-gold w-full" style="padding:12px;font-size:14px;margin-top:6px">Créer mon compte →</button>
      </form>
    </div>
    <div style="text-align:center;margin-top:16px;font-size:13px;color:var(--text3)">Déjà inscrit ? <a href="/login" style="color:var(--gold)">Se connecter</a></div>
  </div>
</div>
{% endblock %}
