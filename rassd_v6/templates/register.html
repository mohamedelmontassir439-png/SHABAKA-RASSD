{% extends "base.html" %}
{% block title %}Inscription — SOURCE{% endblock %}
{% block content %}
<div style="max-width: 400px; margin: 3rem auto;">
    <div class="card">
        <h2 class="card-title text-center">Créer un compte</h2>

        {% if error %}
        <div class="alert alert-error">{{ error }}</div>
        {% endif %}

        {% if success %}
        <div class="alert alert-success">{{ success }}</div>
        {% endif %}

        <form method="post" action="/register">
            <div class="form-group">
                <label class="form-label">Nom complet</label>
                <input type="text" name="nom" class="form-input" placeholder="Votre nom" required>
            </div>

            <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-input" placeholder="votre@email.com" required>
            </div>

            <div class="form-group">
                <label class="form-label">Mot de passe</label>
                <input type="password" name="password" class="form-input" placeholder="Min. 8 caractères" required>
            </div>

            <div class="form-group">
                <label class="form-label">Confirmer le mot de passe</label>
                <input type="password" name="confirm" class="form-input" placeholder="••••••••" required>
            </div>

            <input type="hidden" name="lang" value="fr">

            <button type="submit" class="btn btn-primary" style="width: 100%;">S'inscrire</button>
        </form>

        <div style="text-align: center; margin-top: 1rem; font-size: 0.875rem;">
            <span class="text-muted">Déjà membre ? </span>
            <a href="/login" class="text-primary">Se connecter</a>
        </div>
    </div>
</div>
{% endblock %}
