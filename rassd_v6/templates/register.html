{% extends "base.html" %}
{% block title %}Inscription — RASSD{% endblock %}
{% block body %}
<div class="page-sm">
  <div style="text-align:center;margin-bottom:36px">
    <div style="font-family:var(--mono);font-size:9px;color:var(--g);letter-spacing:2px;margin-bottom:12px">CRÉER UN COMPTE</div>
    <div style="font-family:var(--serif);font-style:italic;font-size:28px;color:var(--t1)">Démarrer les alertes</div>
  </div>
  {% if err %}<div style="background:rgba(224,92,92,.08);border:1px solid rgba(224,92,92,.25);border-radius:var(--r);padding:12px 16px;color:var(--red);font-size:12px;margin-bottom:20px">{{ err }}</div>{% endif %}
  <form method="post" style="display:flex;flex-direction:column;gap:16px">
    <div><label class="lbl">Nom complet</label><input name="nom" class="inp" placeholder="Mohamed Alaoui"></div>
    <div><label class="lbl">Email *</label><input name="email" type="email" class="inp" placeholder="email@entreprise.ma" required></div>
    <div><label class="lbl">Téléphone</label><input name="phone" class="inp" placeholder="+212 6xx xxxxxx"></div>
    <div><label class="lbl">Mot de passe *</label><input name="pw" type="password" class="inp" required minlength="6"></div>
    <div>
      <label class="lbl">Vos secteurs d'activité</label>
      <div style="font-size:11px;color:var(--t4);margin-bottom:10px">Laissez vide pour recevoir tous les marchés</div>
      <div style="display:flex;flex-wrap:wrap;gap:7px">
        {% for s in secteurs %}
        <label style="display:inline-flex;align-items:center;gap:6px;padding:7px 13px;background:var(--s1);border:1px solid var(--bdr);border-radius:99px;cursor:pointer;font-size:11px;color:var(--t3);transition:.15s;user-select:none">
          <input type="checkbox" name="secteurs_sel" value="{{ s }}" style="accent-color:var(--g)" onchange="const l=this.parentElement;l.style.borderColor=this.checked?'var(--g)':'var(--bdr)';l.style.color=this.checked?'var(--g)':'var(--t3)'">{{ s }}
        </label>
        {% endfor %}
      </div>
    </div>
    <button type="submit" class="btn btn-g btn-w" style="padding:13px;margin-top:4px">Créer mon compte →</button>
    <div style="text-align:center;font-size:12px;color:var(--t4)">Déjà inscrit ? <a href="/login" style="color:var(--g)">Se connecter</a></div>
  </form>
</div>
{% endblock %}
