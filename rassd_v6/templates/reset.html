{% extends "base.html" %}
{% block title %}Réinitialiser le mot de passe — SOURCE{% endblock %}
{% block content %}
<div style="max-width: 400px; margin: 3rem auto;">
    <div class="card">
        <h2 class="card-title text-center">Nouveau mot de passe</h2>

        {% if error %}
        <div class="alert alert-error">{{ error }}</div>
        {% endif %}

        <form method="post" action="/reset">
            <input type="hidden" name="token" value="{{ token }}">

            <div class="form-group">
                <label class="form-label">Nouveau mot de passe</label>
                <input type="password" name="password" class="form-input" placeholder="Min. 8 caractères" required>
            </div>

            <div class="form-group">
                <label class="form-label">Confirmer</label>
                <input type="password" name="confirm" class="form-input" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%;">Réinitialiser</button>
        </form>
    </div>
</div>
{% endblock %}
