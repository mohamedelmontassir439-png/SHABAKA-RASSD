{% extends "base.html" %}{% block fullpage %}
<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SOURCE — Nouveau mot de passe</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@800;900&family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>:root{--blue:#c8a96e;--void:#07060a;--surface:#0e0d14;--border:rgba(255,255,255,.08);--border2:rgba(200,169,110,.2);--text1:#f1f5f9;--text2:#94a3b8;--text3:#475569}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--void);color:var(--text1);font-family:'DM Sans',sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}.wrap{width:100%;max-width:380px}.logo{font-family:'Syne',sans-serif;font-weight:900;font-size:22px;text-align:center;margin-bottom:28px;color:var(--blue)}.card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:28px 24px}h2{font-family:'Syne',sans-serif;font-weight:800;font-size:20px;margin-bottom:20px}.field{margin-bottom:16px}label{font-size:11px;font-weight:700;color:var(--text3);display:block;margin-bottom:5px}input{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--border2);border-radius:9px;padding:11px 13px;color:var(--text1);font-family:inherit;font-size:14px;outline:none;transition:.2s}.err{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.25);border-radius:8px;padding:10px 14px;font-size:12px;color:#fca5a5;margin-bottom:14px}.btn{width:100%;padding:13px;border-radius:9px;background:var(--blue);color:#0a0700;font-family:'Syne',sans-serif;font-weight:800;font-size:14px;border:none;cursor:pointer}</style></head>
<body><div class="wrap">
<div class="logo">⚡ SOURCE</div>
<div class="card">
<h2>Nouveau mot de passe</h2>
{% if error %}<div class="err">{{ error }}</div>{% endif %}
<form method="POST" action="/reset">
  <input type="hidden" name="token" value="{{ token }}">
  <div class="field"><label>Nouveau mot de passe</label><input type="password" name="password" required minlength="8" autofocus></div>
  <div class="field"><label>Confirmer</label><input type="password" name="confirm" required minlength="8"></div>
  <button type="submit" class="btn">Enregistrer →</button>
</form>
</div></div></body></html>
{% endblock %}
