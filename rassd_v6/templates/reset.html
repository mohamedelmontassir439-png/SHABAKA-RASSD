{% extends "base.html" %}
{% block title %}Réinitialiser le mot de passe — Atlas Pro{% endblock %}
{% block body %}
<style>
.auth-wrap { min-height: calc(100vh - 260px); display: flex; align-items: center; justify-content: center; padding: 56px 20px; }
.auth-card { width: 100%; max-width: 440px; }
.auth-mark { width: 52px; height: 52px; border-radius: 14px; background: var(--ink); color: var(--gold2); display: flex; align-items: center; justify-content: center; font-weight: 700; font-family: var(--serif); font-size: 24px; margin: 0 auto 24px; }
.auth-title { font-family: var(--serif); font-weight: 700; font-size: 29px; color: var(--text1); line-height: 1.2; letter-spacing: -.01em; text-align: center; margin-bottom: 10px; }
.auth-title em { font-style: italic; color: var(--ink); font-weight: 600; }
.auth-sub { font-size: 15px; color: var(--text3); text-align: center; margin-bottom: 36px; line-height: 1.6; }
.auth-panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r3); box-shadow: var(--sh2); padding: 32px; }
.auth-form { display: flex; flex-direction: column; gap: 20px; }
</style>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-mark">A</div>
    <h1 class="auth-title">Choisir un <em>nouveau mot de passe</em></h1>
    <p class="auth-sub">Il doit contenir au moins 8 caractères.</p>

    <div class="auth-panel">
      {% if err %}<div class="alert alert-err" style="margin-bottom: 20px;">{{ err }}</div>{% endif %}

      <form method="post" class="auth-form">
        <input type="hidden" name="token" value="{{ token }}">
        <div class="field"><label for="pw">Nouveau mot de passe</label><input id="pw" name="pw" type="password" class="inp" required minlength="8" autofocus placeholder="Min. 8 caractères"></div>
        <div class="field"><label for="pw2">Confirmer</label><input id="pw2" name="pw2" type="password" class="inp" required placeholder="Répéter"></div>
        <button type="submit" class="btn btn-primary btn-full btn-lg" style="margin-top: 4px;">Réinitialiser →</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
