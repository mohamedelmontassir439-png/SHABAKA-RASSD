<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}RASSD{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,400;1,700&family=Syne:wght@400;500;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#05050a;--s1:#0a0a12;--s2:#0f0f1a;--bdr:#1a1a28;--bdr2:#252535;
  --g:#c8a850;--g2:#e4c96a;--g3:rgba(200,168,80,.12);
  --t1:#f0ede6;--t2:#c8c4bc;--t3:#8a8680;--t4:#484644;
  --grn:#3dd68c;--red:#e05c5c;--blue:#5c9ee0;
  --serif:'Cormorant Garamond',Georgia,serif;
  --sans:'Syne',system-ui,sans-serif;
  --mono:'JetBrains Mono',monospace;
  --r:6px;--r2:10px;--r3:16px;
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--t2);font-family:var(--sans);font-size:14px;line-height:1.65;min-height:100vh}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 120% 60% at 50% -10%,rgba(200,168,80,.06),transparent 60%);pointer-events:none;z-index:0}
a{color:inherit;text-decoration:none}
/* NAV */
nav{position:sticky;top:0;z-index:100;background:rgba(5,5,10,.88);backdrop-filter:blur(24px);border-bottom:1px solid var(--bdr);height:58px;display:flex;align-items:center;padding:0 28px;gap:28px}
.brand{font-family:var(--serif);font-style:italic;font-size:26px;color:var(--g);letter-spacing:1px;font-weight:700}
.brand-sub{font-family:var(--mono);font-size:9px;color:var(--t4);letter-spacing:2px;text-transform:uppercase;margin-left:8px}
.nav-links{display:flex;gap:2px}
.nav-links a{padding:6px 13px;border-radius:var(--r);font-size:12px;font-weight:500;color:var(--t3);letter-spacing:.3px;transition:.15s}
.nav-links a:hover,.nav-links a.on{background:var(--s2);color:var(--t1);border:1px solid var(--bdr)}
.nav-links a:not(.on){border:1px solid transparent}
.nav-r{margin-left:auto;display:flex;align-items:center;gap:8px}
/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 20px;border-radius:var(--r2);font-family:var(--sans);font-size:13px;font-weight:600;cursor:pointer;border:none;transition:.2s;letter-spacing:.2px;white-space:nowrap}
.btn-g{background:var(--g);color:#000}.btn-g:hover{background:var(--g2);transform:translateY(-1px)}
.btn-o{background:transparent;border:1px solid var(--bdr2);color:var(--t2)}.btn-o:hover{border-color:var(--g);color:var(--g)}
.btn-sm{padding:6px 14px;font-size:11px}
.btn-w{width:100%}
/* CARDS */
.card{background:var(--s1);border:1px solid var(--bdr);border-radius:var(--r3);overflow:hidden}
/* INPUTS */
.inp,.sel{width:100%;background:var(--s1);border:1px solid var(--bdr);border-radius:var(--r);padding:10px 14px;color:var(--t1);font-family:var(--sans);font-size:13px;outline:none;transition:.2s;appearance:none}
.inp:focus,.sel:focus{border-color:var(--g);box-shadow:0 0 0 3px rgba(200,168,80,.08)}
.inp::placeholder{color:var(--t4)}
label.lbl{display:block;font-size:10px;font-weight:700;color:var(--t3);letter-spacing:1px;text-transform:uppercase;margin-bottom:7px}
/* LAYOUT */
.page{max-width:1180px;margin:0 auto;padding:36px 24px;position:relative;z-index:1}
.page-sm{max-width:460px;margin:0 auto;padding:52px 24px;position:relative;z-index:1}
/* TENDER CARD */
.tc{background:var(--s1);border:1px solid var(--bdr);border-radius:var(--r2);padding:18px 20px;transition:.2s;position:relative;display:block}
.tc::after{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:transparent;border-radius:2px 0 0 2px;transition:.2s}
.tc:hover{border-color:var(--bdr2);transform:translateY(-1px);box-shadow:0 12px 40px rgba(0,0,0,.4)}
.tc:hover::after{background:var(--g)}
/* BADGE */
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:99px;font-size:10px;font-weight:700;letter-spacing:.4px}
.badge-g{background:rgba(200,168,80,.12);color:var(--g);border:1px solid rgba(200,168,80,.25)}
.badge-r{background:rgba(224,92,92,.1);color:var(--red)}
.badge-grn{background:rgba(61,214,140,.08);color:var(--grn)}
.badge-b{background:rgba(92,158,224,.1);color:var(--blue)}
/* STATS */
.stat{background:var(--s1);border:1px solid var(--bdr);border-radius:var(--r2);padding:24px;text-align:center}
.stat-n{font-family:var(--serif);font-size:44px;font-weight:700;font-style:italic;color:var(--g);line-height:1}
.stat-l{font-family:var(--mono);font-size:9px;color:var(--t4);margin-top:6px;letter-spacing:1.5px;text-transform:uppercase}
/* SCROLLBAR */
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-thumb{background:var(--bdr2);border-radius:3px}
/* GRAIN */
body::after{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.035'/%3E%3C/svg%3E");pointer-events:none;z-index:9999;opacity:.5}
/* TOAST */
.toast{position:fixed;bottom:28px;right:28px;background:var(--s2);border:1px solid var(--g);border-radius:var(--r);padding:12px 20px;color:var(--g);font-size:12px;font-family:var(--mono);z-index:9000;display:none;animation:toastIn .3s ease}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(max-width:768px){nav{padding:0 16px;gap:12px}.nav-links{display:none}.page{padding:20px 16px}}
</style>
{% block head %}{% endblock %}
</head>
<body>
<nav>
  <div style="display:flex;align-items:baseline;gap:0">
    <a href="/" class="brand">Rassd</a>
    <span class="brand-sub">marchés publics</span>
  </div>
  <div class="nav-links">
    <a href="/tenders" {% if request.url.path.startswith('/tenders') %}class="on"{% endif %}>Marchés</a>
    {% if member %}<a href="/settings" {% if request.url.path=='/settings' %}class="on"{% endif %}>Alertes</a>{% endif %}
  </div>
  <div class="nav-r">
    {% if member %}
      <span style="font-size:11px;color:var(--t4);font-family:var(--mono)">{{ member.nom or member.email[:18] }}</span>
      <a href="/logout" class="btn btn-o btn-sm">Déconnexion</a>
    {% else %}
      <a href="/login" class="btn btn-o btn-sm">Connexion</a>
      <a href="/register" class="btn btn-g btn-sm">S'inscrire</a>
    {% endif %}
  </div>
</nav>
<div class="toast" id="t"></div>
{% block body %}{% endblock %}
<script>
const p=new URLSearchParams(location.search);
if(p.get('ok')){const t=document.getElementById('t');t.textContent='✓ Enregistré';t.style.display='block';setTimeout(()=>t.style.display='none',3000);history.replaceState({},'',location.pathname)}
</script>
</body>
</html>
