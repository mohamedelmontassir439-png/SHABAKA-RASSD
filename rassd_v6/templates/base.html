<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#030303">
<title>{% block title %}{{ BRAND }}{% endblock %}</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><polygon points='16,2 30,11 30,21 16,30 2,21 2,11' fill='%23c9a84c'/></svg>">
<style>
:root{
  --void:#030303;--surface:#0c0c0c;--raised:#111;--lift:#161616;--panel:#1a1a1a;
  --bdr:rgba(255,255,255,.06);--bdr2:rgba(255,255,255,.1);--bdr3:rgba(255,255,255,.15);
  --ink:#f3eee7;--ink2:#e8e2db;--ink3:#c8c0b8;--ink4:#a89f97;--ink5:#786f67;
  --g1:#f0d896;--g2:#c9a84c;--g3:#a07830;--glow:rgba(201,168,76,.08);
  --grn:#5a9e78;--grn2:rgba(90,158,120,.12);
  --red:#c46060;--red2:rgba(196,96,96,.12);
  --r:4px;--r2:8px;--r3:12px;
  --sans:'DM Sans',system-ui,sans-serif;
  --nh:56px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--void);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.6;min-height:100vh;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:var(--sans);cursor:pointer}
input,select,textarea{font-family:var(--sans)}

/* NAV */
nav{height:var(--nh);background:rgba(3,3,3,.95);border-bottom:1px solid var(--bdr);display:flex;align-items:center;padding:0 24px;gap:16px;position:sticky;top:0;z-index:100;backdrop-filter:blur(12px)}
.nav-brand{font-weight:700;font-size:16px;color:var(--g2);letter-spacing:.5px;flex-shrink:0}
.nav-brand span{color:var(--ink)}
.nav-links{display:flex;gap:4px;margin-left:8px;flex:1}
.nav-links a{padding:6px 12px;border-radius:var(--r);color:var(--ink4);font-size:13px;transition:all .15s}
.nav-links a:hover,.nav-links a.active{color:var(--ink);background:var(--raised)}
.nav-right{display:flex;gap:8px;align-items:center;margin-left:auto}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--r);font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;border:none}
.btn-gold{background:var(--g2);color:#000}.btn-gold:hover{background:var(--g1)}
.btn-ghost{background:transparent;color:var(--ink4);border:1px solid var(--bdr2)}.btn-ghost:hover{color:var(--ink);border-color:var(--bdr3);background:var(--raised)}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-danger{background:var(--red2);color:var(--red);border:1px solid rgba(196,96,96,.2)}.btn-danger:hover{background:rgba(196,96,96,.2)}

/* LAYOUT */
.container{max-width:1200px;margin:0 auto;padding:0 24px}
.page{padding:32px 24px;max-width:1200px;margin:0 auto}

/* CARDS */
.card{background:var(--raised);border:1px solid var(--bdr);border-radius:var(--r3);padding:24px;transition:border-color .15s}
.card:hover{border-color:var(--bdr2)}
.card-sm{padding:16px}

/* BADGE */
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:.3px}
.badge-t{background:rgba(90,127,160,.15);color:#5a9ecc}
.badge-p{background:rgba(90,158,120,.15);color:var(--grn)}
.badge-s{background:rgba(201,168,76,.15);color:var(--g2)}
.badge-e{background:rgba(160,120,90,.15);color:#c9845a}
.badge-actif{background:var(--grn2);color:var(--grn)}
.badge-expire{background:var(--red2);color:var(--red)}

/* FORM */
.form-group{margin-bottom:16px}
.form-group label{display:block;margin-bottom:6px;color:var(--ink3);font-size:12px;font-weight:600;letter-spacing:.5px;text-transform:uppercase}
.form-control{width:100%;padding:10px 14px;background:var(--panel);border:1px solid var(--bdr2);border-radius:var(--r2);color:var(--ink);font-size:14px;transition:border-color .15s}
.form-control:focus{outline:none;border-color:var(--g2)}
select.form-control{cursor:pointer}

/* TABLE */
.table-wrap{overflow-x:auto;border-radius:var(--r3);border:1px solid var(--bdr)}
table{width:100%;border-collapse:collapse}
th{padding:10px 16px;text-align:left;font-size:11px;font-weight:600;color:var(--ink5);letter-spacing:.5px;text-transform:uppercase;background:var(--surface);border-bottom:1px solid var(--bdr)}
td{padding:12px 16px;border-bottom:1px solid var(--bdr);font-size:13px;color:var(--ink3)}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--raised);color:var(--ink)}

/* ALERT */
.alert{padding:12px 16px;border-radius:var(--r2);font-size:13px;margin-bottom:16px}
.alert-ok{background:var(--grn2);border:1px solid rgba(90,158,120,.2);color:var(--grn)}
.alert-err{background:var(--red2);border:1px solid rgba(196,96,96,.2);color:var(--red)}

/* PAGINATION */
.pagination{display:flex;gap:6px;align-items:center;margin-top:24px;justify-content:center}
.pagination a,.pagination span{padding:6px 12px;border-radius:var(--r);font-size:13px;border:1px solid var(--bdr2);color:var(--ink4)}
.pagination a:hover{color:var(--ink);border-color:var(--bdr3);background:var(--raised)}
.pagination span.current{background:var(--g2);color:#000;border-color:var(--g2)}

/* STATS */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin-bottom:32px}
.stat-card{background:var(--raised);border:1px solid var(--bdr);border-radius:var(--r3);padding:20px;text-align:center}
.stat-num{font-size:32px;font-weight:700;color:var(--g2);line-height:1}
.stat-lbl{font-size:12px;color:var(--ink5);margin-top:6px;text-transform:uppercase;letter-spacing:.5px}

/* FLASH */
.flash{position:fixed;bottom:24px;right:24px;padding:12px 20px;border-radius:var(--r2);font-size:13px;font-weight:600;z-index:9999;animation:slideUp .3s ease}
.flash-ok{background:var(--grn);color:#fff}
.flash-err{background:var(--red);color:#fff}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}

/* TENDER CARD */
.tender-card{background:var(--raised);border:1px solid var(--bdr);border-radius:var(--r3);padding:20px;transition:border-color .15s,transform .15s}
.tender-card:hover{border-color:var(--g3);transform:translateY(-1px)}
.tender-card h3{font-size:15px;font-weight:600;color:var(--ink);margin-bottom:8px;line-height:1.4}
.tender-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.tender-meta span{font-size:12px;color:var(--ink5)}
.tender-meta span b{color:var(--ink4)}
.dl-badge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600}
.dl-soon{background:rgba(196,96,96,.15);color:var(--red)}
.dl-ok{background:rgba(90,158,120,.15);color:var(--grn)}
.dl-unknown{background:var(--panel);color:var(--ink5)}

/* FILTERS */
.filters-bar{background:var(--surface);border:1px solid var(--bdr);border-radius:var(--r3);padding:16px;margin-bottom:24px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.filter-item{display:flex;flex-direction:column;gap:4px;min-width:150px}
.filter-item label{font-size:11px;color:var(--ink5);text-transform:uppercase;letter-spacing:.4px;font-weight:600}
.filter-item select,.filter-item input{padding:8px 12px;background:var(--raised);border:1px solid var(--bdr2);border-radius:var(--r);color:var(--ink);font-size:13px}
.filter-item select:focus,.filter-item input:focus{outline:none;border-color:var(--g2)}

/* SECTEUR PICKER */
.secteur-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px;margin-top:8px}
.secteur-item{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--raised);border:1px solid var(--bdr);border-radius:var(--r2);cursor:pointer;transition:all .15s}
.secteur-item:hover{border-color:var(--bdr2)}
.secteur-item input[type=checkbox]:checked + .si-label{color:var(--g2)}
.secteur-item.checked{border-color:var(--g3);background:var(--glow)}
.si-code{font-size:11px;font-weight:700;color:var(--ink5);width:36px;flex-shrink:0}
.si-label{font-size:13px;color:var(--ink3)}

/* RESPONSIVE */
@media(max-width:768px){
  .nav-links{display:none}
  .filters-bar{flex-direction:column}
  .filter-item{min-width:100%}
  .secteur-grid{grid-template-columns:1fr}
}
</style>
{% block head %}{% endblock %}
</head>
<body>
<nav>
  <a href="/" class="nav-brand">Modern<span>Business</span></a>
  {% if member %}
  <div class="nav-links">
    <a href="/tenders" class="{{ 'active' if '/tenders' in request.url.path }}">📋 Marchés</a>
    <a href="/settings" class="{{ 'active' if '/settings' in request.url.path }}">⚙️ Paramètres</a>
  </div>
  <div class="nav-right">
    <span style="color:var(--ink5);font-size:12px">{{ member.nom }}</span>
    <a href="/logout" class="btn btn-ghost btn-sm">Déconnexion</a>
  </div>
  {% else %}
  <div class="nav-right">
    <a href="/login" class="btn btn-ghost btn-sm">Connexion</a>
    <a href="/register" class="btn btn-gold btn-sm">Commencer →</a>
  </div>
  {% endif %}
</nav>

{% if request.query_params.get('_flash') %}
<div class="flash flash-{{ request.query_params.get('_fk','ok') }}" id="flash-msg">
  {{ request.query_params.get('_flash') }}
</div>
<script>setTimeout(()=>{const f=document.getElementById('flash-msg');if(f)f.remove()},3500)</script>
{% endif %}

{% block content %}{% endblock %}
</body>
</html>
