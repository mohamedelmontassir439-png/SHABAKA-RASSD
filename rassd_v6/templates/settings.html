{% extends "base.html" %}
{% block title %}Paramètres{% endblock %}
{% block body %}
<div style="max-width:640px;margin:0 auto;padding:36px 24px 64px">
  <div class="flex items-center justify-between mb-24">
    <h2 style="font-size:22px">Paramètres</h2>
    <a href="/dashboard" class="btn btn-ghost btn-sm">← Dashboard</a>
  </div>
  {% if success %}<div class="form-success mb-16">{{ success }}</div>{% endif %}
  {% if error %}<div class="form-error">{{ error }}</div>{% endif %}
  <form method="post" action="/settings">
    <div class="card mb-14">
      <div class="card-header card-gold-header">Profil</div>
      <div class="p-20 grid-2">
        <div class="form-group"><label class="form-label">Nom *</label><input type="text" name="nom" value="{{ m.nom }}" class="form-input" required></div>
        <div class="form-group"><label class="form-label">Entreprise</label><input type="text" name="entreprise" value="{{ m.entreprise or '' }}" class="form-input"></div>
        <div class="form-group"><label class="form-label">Téléphone</label><input type="text" name="phone" value="{{ m.phone or '' }}" class="form-input"></div>
        <div class="form-group"><label class="form-label">Ville</label><input type="text" name="ville" value="{{ m.ville or '' }}" class="form-input"></div>
        <div class="form-group" style="grid-column:span 2">
          <label class="form-label">Secteur</label>
          <select name="secteur" class="form-select">
            <option value="">—</option>
            {% for s in SECTEURS_LIST %}<option value="{{ s }}" {% if m.secteur==s %}selected{% endif %}>{{ s }}</option>{% endfor %}
          </select>
        </div>
      </div>
    </div>
    <div class="card mb-14">
      <div class="card-header">Notifications</div>
      <div class="p-20">
        <label class="flex items-center gap-12 mb-12" style="cursor:pointer">
          <input type="checkbox" name="notif_email" {% if m.get('notif_email',1) %}checked{% endif %} style="width:16px;height:16px;accent-color:var(--gold)">
          <div><div class="font-bold text-sm">Email</div><div class="text-xs text-muted">Recevoir les alertes par email</div></div>
        </label>
        <label class="flex items-center gap-12" style="cursor:pointer">
          <input type="checkbox" name="notif_tg" {% if m.get('notif_tg',1) %}checked{% endif %} style="width:16px;height:16px;accent-color:var(--gold)">
          <div>
            <div class="font-bold text-sm">Telegram</div>
            <div class="text-xs text-muted">
              {% if m.telegram %}✓ Connecté ({{ m.telegram[:8] }}…)
              {% else %}Envoyer <code>/link {{ m.email }}</code> à <b>@MarchesMarocBot</b>{% endif %}
            </div>
          </div>
        </label>
      </div>
    </div>
    <div class="card mb-20">
      <div class="card-header">Sécurité</div>
      <div class="p-20 grid-2">
        <div class="form-group"><label class="form-label">Mot de passe actuel</label><input type="password" name="password" class="form-input" placeholder="••••••••"></div>
        <div class="form-group"><label class="form-label">Nouveau mot de passe</label><input type="password" name="password_new" class="form-input" placeholder="Min. 8 caractères"></div>
      </div>
    </div>
    <button type="submit" class="btn btn-gold btn-lg">Enregistrer →</button>
  </form>
</div>
{% endblock %}
