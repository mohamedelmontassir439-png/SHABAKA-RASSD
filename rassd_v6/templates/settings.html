{% extends "base.html" %}
{% block title %}Paramètres — SOURCE{% endblock %}
{% block content %}
<div style="max-width: 600px; margin: 2rem auto;">
    <div class="card">
        <h2 class="card-title">Paramètres</h2>

        {% if saved %}
        <div class="alert alert-success">Paramètres sauvegardés avec succès !</div>
        {% endif %}

        <form method="post" action="/settings">
            <div class="form-group">
                <label class="form-label">Langue</label>
                <select name="lang" class="form-input">
                    <option value="fr" {% if member.lang == 'fr' %}selected{% endif %}>Français</option>
                    <option value="ar" {% if member.lang == 'ar' %}selected{% endif %}>العربية</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">Secteurs STX10</label>
                <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.5rem;">
                    {% for code, label in STX10.items() %}
                    <label style="display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem; background: #0f172a; border-radius: 6px; cursor: pointer;">
                        <input type="checkbox" name="stx10_codes" value="{{ code }}" {% if code in member_codes %}checked{% endif %}>
                        <span style="font-size: 0.875rem;">{{ code }} - {{ label }}</span>
                    </label>
                    {% endfor %}
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Régions (séparées par des virgules)</label>
                <input type="text" name="regions" class="form-input" placeholder="Casablanca, Rabat, Marrakech"
                       value="{{ member_regions|join(', ') if member_regions else '' }}">
            </div>

            <div class="form-group">
                <label class="form-label">ID Telegram (pour notifications)</label>
                <input type="text" name="telegram" class="form-input" placeholder="@username ou ID numérique"
                       value="{{ member.telegram if member else '' }}">
            </div>

            <div class="form-group">
                <label class="form-label">Numéro WhatsApp</label>
                <input type="text" name="whatsapp" class="form-input" placeholder="+212600000000"
                       value="{{ member.whatsapp if member else '' }}">
            </div>

            <div class="form-group">
                <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                    <input type="checkbox" name="notif_tg" {% if member and member.notif_tg %}checked{% endif %}>
                    <span>Notifications Telegram</span>
                </label>
            </div>

            <div class="form-group">
                <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                    <input type="checkbox" name="notif_email" {% if member and member.notif_email %}checked{% endif %}>
                    <span>Notifications Email</span>
                </label>
            </div>

            <div class="form-group">
                <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                    <input type="checkbox" name="notif_wa" {% if member and member.notif_wa %}checked{% endif %}>
                    <span>Notifications WhatsApp</span>
                </label>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%;">Sauvegarder</button>
        </form>
    </div>
</div>
{% endblock %}
