{% extends "base.html" %}
{% block title %}Paramètres{% endblock %}
{% block body %}
<div style="max-width:640px;margin:0 auto;padding:36px 28px 64px">
  <div class="flex items-center justify-between mb-28">
    <h2 style="font-size:22px;margin:0">Paramètres</h2>
    <a href="/dashboard" class="btn btn-ghost btn-sm">← Dashboard</a>
  </div>
  {% if success %}<div class="form-success mb-16">{{ success }}</div>{% endif %}
  {% if error %}<div class="form-error">{{ error }}</div>{% endif %}
  <form method="post" action="/settings">
    <div class="card mb-16">
      <div style="padding:12px 16px;border-bottom:1px solid var(--border);background:var(--bg3)"><span style="font-size:10px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:.6px">Profil</span></div>
      <div style="padding:20px;display:grid;grid-template-columns:1fr 1fr;gap:14px">
        <div class="form-group mb-0"><label class="form-label">Nom *</label><input type="text" name="nom" value="{{ c.nom }}" class="form-input" required></div>
        <div class="form-group mb-0"><label class="form-label">Entreprise</label><input type="text" name="entreprise" value="{{ c.entreprise or '' }}" class="form-input"></div>
        <div class="form-group mb-0"><label class="form-label">Téléphone</label><input type="text" name="phone" value="{{ c.phone or '' }}" class="form-input"></div>
        <div class="form-group mb-0"><label class="form-label">Ville</label><input type="text" name="ville" value="{{ c.ville or '' }}" class="form-input"></div>
        <div class="form-group mb-0" style="grid-column:span 2">
          <label class="form-label">Secteur</label>
          <select name="secteur" class="form-select">
            <option value="">—</option>
            {% for s in SECTEURS %}<option value="{{ s }}" {% if c.secteur==s %}selected{% endif %}>{{ s }}</option>{% endfor %}
          </select>
        </div>
      </div>
    </div>
    <div class="card mb-20">
      <div style="padding:12px 16px;border-bottom:1px solid var(--border);background:var(--bg3)"><span style="font-size:10px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:.6px">Sécurité</span></div>
      <div style="padding:20px;display:grid;grid-template-columns:1fr 1fr;gap:14px">
        <div class="form-group mb-0"><label class="form-label">Mot de passe actuel</label><input type="password" name="password" class="form-input" placeholder="••••••••"></div>
        <div class="form-group mb-0"><label class="form-label">Nouveau mot de passe</label><input type="password" name="password_new" class="form-input" placeholder="Min. 8 caractères"></div>
      </div>
    </div>
    <button type="submit" class="btn btn-gold btn-lg">Enregistrer →</button>
  </form>
</div>
{% endblock %}
