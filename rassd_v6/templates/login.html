{% extends "base.html" %}
{% block title %}Connexion{% endblock %}
{% block body %}
<div style="min-height:calc(100vh - var(--nav));display:flex;align-items:center;justify-content:center;padding:40px 20px">
  <div style="width:100%;max-width:360px">
    <div class="text-center mb-24">
      <div class="font-serif" style="font-size:24px;font-weight:700;margin-bottom:4px">Connexion</div>
      <div class="text-sm text-muted">Accédez à votre espace</div>
    </div>
    {% if error %}<div class="form-error">{{ error }}</div>{% endif %}
    <div class="card p-24">
      <form method="post" action="/login">
        <div class="form-group"><label class="form-label">Email *</label><input type="email" name="email" class="form-input" placeholder="vous@entreprise.ma" required autofocus></div>
        <div class="form-group"><label class="form-label">Mot de passe *</label><input type="password" name="password" class="form-input" placeholder="••••••••" required></div>
        <button type="submit" class="btn btn-gold btn-full" style="padding:11px;font-size:14px;margin-top:4px">Se connecter →</button>
      </form>
    </div>
    <div class="text-center mt-16 text-sm text-muted">Pas encore inscrit ? <a href="/register" class="text-gold font-bold">Créer un compte</a></div>
  </div>
</div>
{% endblock %}
