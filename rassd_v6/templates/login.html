{% extends "base.html" %}
{% block title %}Connexion{% endblock %}
{% block body %}
<div style="min-height:calc(100vh - var(--nav-h));display:flex;align-items:center;justify-content:center;padding:40px 20px">
  <div style="width:100%;max-width:380px">
    <div style="text-align:center;margin-bottom:32px">
      <div style="font-family:var(--serif);font-size:28px;font-weight:700;color:var(--text);margin-bottom:6px">Connexion</div>
      <div style="font-size:13px;color:var(--text-3)">Accédez à votre tableau de bord</div>
    </div>
    {% if error %}<div class="form-error">{{ error }}</div>{% endif %}
    <div class="card" style="padding:28px">
      <form method="post" action="/login">
        <div class="form-group">
          <label class="form-label">Adresse email</label>
          <input type="email" name="email" class="form-input" placeholder="vous@entreprise.ma" required autofocus>
        </div>
        <div class="form-group">
          <label class="form-label">Mot de passe</label>
          <input type="password" name="password" class="form-input" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-gold w-full" style="justify-content:center;padding:11px;font-size:14px;margin-top:8px">Se connecter →</button>
      </form>
    </div>
    <div style="text-align:center;margin-top:20px;font-size:13px;color:var(--text-3)">
      Pas encore de compte ? <a href="/register" style="color:var(--gold);font-weight:600">Inscription gratuite</a>
    </div>
  </div>
</div>
{% endblock %}
