{% extends "base.html" %}
{% block title %}Connexion — SOURCE{% endblock %}
{% block content %}
<div style="max-width: 400px; margin: 3rem auto;">
    <div class="card">
        <h2 class="card-title text-center">Connexion</h2>

        {% if error %}
        <div class="alert alert-error">{{ error }}</div>
        {% endif %}

        <form method="post" action="/login">
            <input type="hidden" name="next_url" value="{{ next }}">
            <input type="hidden" name="lang" value="fr">

            <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-input" placeholder="votre@email.com" required>
            </div>

            <div class="form-group">
                <label class="form-label">Mot de passe</label>
                <input type="password" name="password" class="form-input" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%;">Se connecter</button>
        </form>

        <div style="text-align: center; margin-top: 1rem; font-size: 0.875rem;">
            <a href="/forgot" class="text-muted">Mot de passe oublié ?</a>
            <span class="text-muted"> | </span>
            <a href="/register" class="text-primary">Créer un compte</a>
        </div>
    </div>
</div>
{% endblock %}
