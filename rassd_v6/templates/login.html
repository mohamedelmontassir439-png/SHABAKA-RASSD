{% extends "base.html" %}
{% block title %}Connexion — {{ BRAND }}{% endblock %}
{% block content %}
<div style="min-height:calc(100vh - var(--nav-h));display:flex;align-items:center;justify-content:center;padding:40px 28px">
  <div style="width:100%;max-width:420px">

    <div style="text-align:center;margin-bottom:32px">
      <div style="font-family:var(--ff-display);font-size:28px;font-weight:900;color:var(--a2);margin-bottom:4px">{{ BRAND }}</div>
      <div style="font-size:13px;color:var(--t5)">{{ TAGLINE }}</div>
    </div>

    {% if error %}
    <div class="alert alert-err">⚠ {{ error }}</div>
    {% endif %}

    <div class="card">
      <div class="card-header">
        <span class="card-title">Connexion</span>
      </div>
      <form method="post" action="/login" novalidate>
        <input type="hidden" name="next_url" value="{{ next or '/tenders' }}">
        <div class="form-group">
          <label class="form-label">Adresse email</label>
          <input type="email" name="email" class="form-control"
                 placeholder="votre@email.ma" required autofocus autocomplete="email">
        </div>
        <div class="form-group">
          <label class="form-label">Mot de passe</label>
          <input type="password" name="password" class="form-control"
                 placeholder="••••••••" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary btn-lg btn-block" style="margin-top:8px">
          Se connecter →
        </button>
      </form>
    </div>

    <div style="text-align:center;margin-top:20px;font-size:13px;color:var(--t5)">
      Pas encore de compte ?
      <a href="/register" style="color:var(--a2);font-weight:600">S'inscrire gratuitement</a>
    </div>
  </div>
</div>
{% endblock %}
