{% extends "base.html" %}
{% block title %}Connexion — {{ BRAND }}{% endblock %}
{% block content %}
<div style="max-width:420px;margin:80px auto;padding:0 24px">
  <div style="text-align:center;margin-bottom:32px">
    <h1 style="font-size:24px;font-weight:700">Connexion</h1>
  </div>
  {% if error %}
  <div class="alert alert-err">{{ error }}</div>
  {% endif %}
  <div class="card">
    <form method="post" action="/login">
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" class="form-control" placeholder="votre@email.ma" required autofocus>
      </div>
      <div class="form-group">
        <label>Mot de passe</label>
        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-gold" style="width:100%;padding:12px;font-size:15px;margin-top:8px">Se connecter →</button>
      <p style="text-align:center;margin-top:16px;color:var(--ink5);font-size:13px">
        Pas encore inscrit ? <a href="/register" style="color:var(--g2)">Créer un compte</a>
      </p>
    </form>
  </div>
</div>
{% endblock %}
