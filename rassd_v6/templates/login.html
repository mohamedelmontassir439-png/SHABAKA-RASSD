{% extends "base.html" %}
{% block title %}Connexion — RASSD{% endblock %}
{% block body %}
<div class="page-narrow" style="max-width:400px">
  <div style="text-align:center;margin-bottom:36px">
    <div style="font-family:var(--mono);font-size:9px;color:var(--gold);letter-spacing:2px;margin-bottom:12px">CONNEXION</div>
    <h1 style="font-family:var(--serif);font-style:italic;font-size:28px;color:var(--text1)">Bon retour</h1>
  </div>
  {% if err %}<div class="alert alert-err" style="margin-bottom:20px">{{ err }}</div>{% endif %}
  <form method="post" style="display:flex;flex-direction:column;gap:16px">
    <input type="hidden" name="next" value="{{ next }}">
    <div class="field"><label>Email</label><input name="email" type="email" class="inp" required autofocus value="{{ (vals or {}).get('email','') }}"></div>
    <div class="field"><label>Mot de passe</label><input name="pw" type="password" class="inp" required></div>
    <button type="submit" class="btn btn-primary btn-full" style="padding:13px;font-size:14px">Se connecter →</button>
    <p style="text-align:center;font-size:12px;color:var(--text4)">Pas encore de compte ? <a href="/register" style="color:var(--gold)">S'inscrire gratuitement</a></p>
  </form>
</div>
{% endblock %}
