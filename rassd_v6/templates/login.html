{% extends "base.html" %}
{% block title %}Connexion — RASSD{% endblock %}
{% block body %}
<div class="page-sm">
  <div style="text-align:center;margin-bottom:36px">
    <div style="font-family:var(--mono);font-size:9px;color:var(--g);letter-spacing:2px;margin-bottom:12px">CONNEXION</div>
    <div style="font-family:var(--serif);font-style:italic;font-size:28px;color:var(--t1)">Bienvenue</div>
  </div>
  {% if err %}<div style="background:rgba(224,92,92,.08);border:1px solid rgba(224,92,92,.25);border-radius:var(--r);padding:12px 16px;color:var(--red);font-size:12px;margin-bottom:20px">{{ err }}</div>{% endif %}
  <form method="post" style="display:flex;flex-direction:column;gap:16px">
    <div><label class="lbl">Email</label><input name="email" type="email" class="inp" required></div>
    <div><label class="lbl">Mot de passe</label><input name="pw" type="password" class="inp" required></div>
    <button type="submit" class="btn btn-g btn-w" style="padding:13px">Se connecter →</button>
    <div style="text-align:center;font-size:12px;color:var(--t4)">Pas de compte ? <a href="/register" style="color:var(--g)">S'inscrire</a></div>
  </form>
</div>
{% endblock %}
