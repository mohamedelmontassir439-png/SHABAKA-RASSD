{% extends "base.html" %}
{% block title %}Connexion — RASSD{% endblock %}
{% block body %}
<div class="page-sm">
  <div style="text-align:center;margin-bottom:32px">
    <div style="font-family:var(--serif);font-size:28px;font-weight:700;font-style:italic;color:var(--gold);margin-bottom:8px">Connexion</div>
  </div>
  {% if err %}<div style="background:rgba(232,96,96,.1);border:1px solid rgba(232,96,96,.3);border-radius:var(--r);padding:12px 16px;color:var(--red);font-size:13px;margin-bottom:20px">{{ err }}</div>{% endif %}
  <form method="post" style="display:flex;flex-direction:column;gap:16px">
    <div><label>Email</label><input name="email" type="email" class="inp" required></div>
    <div><label>Mot de passe</label><input name="pw" type="password" class="inp" required></div>
    <button type="submit" class="btn btn-gold btn-full" style="padding:12px">Se connecter →</button>
    <div style="text-align:center;font-size:12px;color:var(--ink4)">Pas de compte? <a href="/register" style="color:var(--gold)">S'inscrire</a></div>
  </form>
</div>
{% endblock %}
