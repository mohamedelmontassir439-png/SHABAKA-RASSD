{% extends "base.html" %}
{% block body %}
<div class="page-sm" style="padding-top:80px">
  <div style="text-align:center;margin-bottom:32px">
    <div style="font-family:var(--mono);font-size:9px;color:var(--t4);letter-spacing:2px">ADMINISTRATION</div>
  </div>
  {% if err %}<div style="color:var(--red);font-size:12px;text-align:center;margin-bottom:16px">{{ err }}</div>{% endif %}
  <form method="post" action="/admin/login" style="display:flex;flex-direction:column;gap:12px">
    <input name="pwd" type="password" class="inp" placeholder="Mot de passe admin" autofocus>
    <button type="submit" class="btn btn-g btn-w">Accéder →</button>
  </form>
</div>
{% endblock %}
