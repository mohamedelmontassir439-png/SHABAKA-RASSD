{% extends "base.html" %}
{% block title %}Configuration — SOURCE{% endblock %}
{% block content %}
<div style="max-width: 600px; margin: 3rem auto;">
    <div class="card">
        <h2 class="card-title text-center">Personnalisez votre expérience</h2>
        <p class="text-muted text-center mb-3">Sélectionnez vos secteurs d'intérêt</p>

        <form method="post" action="/onboarding">
            <div class="form-group">
                <label class="form-label">Secteurs STX10</label>
                <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.5rem;">
                    {% for code, label in STX10.items() %}
                    <label style="display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem; background: #0f172a; border-radius: 6px; cursor: pointer;">
                        <input type="checkbox" name="stx10_codes" value="{{ code }}">
                        <span style="font-size: 0.875rem;">{{ code }} - {{ label }}</span>
                    </label>
                    {% endfor %}
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Régions (optionnel)</label>
                <input type="text" name="regions" class="form-input" placeholder="Casablanca, Rabat, ...">
            </div>

            <input type="hidden" name="lang" value="{{ lang }}">

            <button type="submit" class="btn btn-primary" style="width: 100%;">Continuer</button>
        </form>
    </div>
</div>
{% endblock %}
